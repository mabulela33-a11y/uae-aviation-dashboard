name: Sync UAE Aviation Data

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0,12 * * *'
  workflow_dispatch:

jobs:
  sync-flight-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Live Traffic & Update Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
        run: |
          node -e '
          const https = require("https");

          async function fetchHubFlights(iata) {
            return new Promise((resolve) => {
              const url = `https://api.aviationstack.com/v1/flights?access_key=${process.env.AVIATIONSTACK_KEY}&arr_iata=${iata}&flight_status=active`;
              https.get(url, (res) => {
                let data = "";
                res.on("data", chunk => data += chunk);
                res.on("end", () => {
                  try {
                    const parsed = JSON.parse(data);
                    resolve(parsed.pagination ? parsed.pagination.total : 0);
                  } catch (e) {
                    resolve(0);
                  }
                });
              }).on("error", () => resolve(0));
            });
          }

          async function updateSupabase(totalFlights) {
            const data = JSON.stringify({
              metric_value: totalFlights,
              updated_at: new Date().toISOString()
            });

            // Hardcoded Supabase URL to avoid environment variable resolution issues
            const fullUrl = "https://stdxueftoewwnhbqncbo.supabase.co/rest/v1/dashboard_config?metric_key=eq.total_active_flights";
            const url = new URL(fullUrl);
            
            const options = {
              hostname: url.hostname,
              path: url.pathname + url.search,
              method: "PATCH",
              headers: {
                "apikey": process.env.SUPABASE_SERVICE_KEY,
                "Authorization": `Bearer ${process.env.SUPABASE_SERVICE_KEY}`,
                "Content-Type": "application/json",
                "Prefer": "return=minimal"
              }
            };

            return new Promise((resolve, reject) => {
              const req = https.request(options, (res) => {
                let resData = "";
                res.on("data", chunk => resData += chunk);
                res.on("end", () => resolve(resData));
              });
              req.on("error", reject);
              req.write(data);
              req.end();
            });
          }

          async function sync() {
            const dxb = await fetchHubFlights("DXB");
            const auh = await fetchHubFlights("AUH");
            const shj = await fetchHubFlights("SHJ");
            const dwc = await fetchHubFlights("DWC");

            const total = dxb + auh + shj + dwc;
            console.log(`Fetched Live Traffic - DXB: ${dxb}, AUH: ${auh}, SHJ: ${shj}, DWC: ${dwc}, Total: ${total}`);

            await updateSupabase(total);
            console.log("Supabase successfully updated with live flight metrics!");
          }

          sync();
          '
