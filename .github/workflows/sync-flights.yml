name: Sync UAE Aviation Data

on:
  schedule:
    - cron: '0 8 * * *'   # once a day, 12:00 UAE time (fits the 100-request free plan)
  workflow_dispatch:

jobs:
  sync-flight-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch live traffic and update Supabase
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          AVIATIONSTACK_KEY: ${{ secrets.AVIATIONSTACK_KEY }}
        run: node scripts/sync-flights.js
